# Example policy profile. Configure your Jira URL and numeric project ID locally.

[general]
product_name = "ARGUS"
team_name = "Mobile"
team_slug = "mobile"
state_dir = "~/.argus/mobile"

[extractor]
base_url = "https://jira.example.com"
project_id = "10000"
jira_pat_env = "ARGUS_JIRA_PAT"
jira_pat_path = "~/.argus/jira.pat"
execution_key_pattern = "^[A-Z][A-Z0-9_]*-E[0-9]+$"
out_dir = "output/mobile"
ignored_execution_statuses = ["Automation Pass", "Automation Fail"]

[auditor]
model_id = "claude-sonnet-5-5"
prompt_variant = "mobile_v2"
temperature = 0.0
consensus_enabled = true
chunk_threshold = 70
chunk_size = 50
chunk_overlap = 5
chunk_max_parallel = 2
env_check_inline = false
env_check_engine = "off"

[batch]
concurrency = 16
extractor_concurrency = 4

[notify]
mode = "verbose"
bot_admin_users = []

[folders]
auto_folder_enabled = false
auto_name_prefix = "Mobile regression"
auto_max_age_days = 30
dashboard_sections = ["Mobile regression"]

[policy]
enabled_rules = ["R0", "R1", "R2", "R4", "R5", "R7", "R8", "R10", "R11", "R12", "R14", "R15a", "R15c", "R16", "R17", "R18", "R20", "R21"]
defect_key_prefixes = ["QA-", "BUG-"]
storefront_domain = "example"
environment_check_enabled = false
empty_step_status_optional = true

[policy.marketplace_tlds]
US = ".com"
CA = ".ca"
UK = ".co.uk"
DE = ".de"
FR = ".fr"
IT = ".it"
ES = ".es"
IN = ".in"
JP = ".co.jp"
AU = ".com.au"
BR = ".com.br"
MX = ".com.mx"

[policy.statuses]
pass = "Pass"
fail = "Fail"
blocked = "Blocked"
in_progress = "In Progress"
passed_with_issue = "Passed With Issue"
not_applicable = "Not Applicable"
not_executed = "Not Executed"
retest = "Retest"

[policy.status_aliases]
"Automation Pass" = "pass"
"Automation Fail" = "fail"

[policy.rule_severities]
R0 = "high"
R1 = "high"
R2 = "high"
R2b = "high"
R4 = "high"
R5 = "high"
R7 = "high"
R8 = "high"
R10 = "high"
R11 = "high"
R12 = "high"
R14 = "high"
R15a = "high"
R15c = "high"
R16 = "high"
R17 = "high"
R18 = "high"
R20 = "high"
R21 = "high"

[prune]
enabled = true
older_than_days = 60

[server]
host = "127.0.0.1"
port = 2409

[hub]
teams = ["web=Web", "desktop=Desktop", "tablet=Tablet", "mobile=Mobile", "reader=Reader", "tv=Tv", "portal=Portal"]

[costs]
refresh_seconds = 300
monthly_budget_usd = 100.0
warning_percent = 80.0
critical_percent = 100.0
