name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,video,browser]"
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Python tests
        run: pytest -q
      - name: JavaScript tests
        run: node --test tests/js/*.test.cjs tests/operator-controls.test.mjs
      - name: Build distributions
        run: python -m build
      - name: Check public distribution contents
        run: python tools/check_public_tree.py --archives dist
