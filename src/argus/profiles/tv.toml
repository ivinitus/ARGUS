# Example policy profile. Configure your Jira URL and numeric project ID locally.

[general]
product_name = "ARGUS"
team_name = "Tv"
team_slug = "tv"
state_dir = "~/.argus/tv"

[extractor]
base_url = "https://jira.example.com"
project_id = "10000"
jira_pat_env = "ARGUS_JIRA_PAT"
jira_pat_path = "~/.argus/jira.pat"
execution_key_pattern = "^[A-Z][A-Z0-9_]*-E[0-9]+$"
out_dir = "output/tv"
include_test_case_weblinks = true

[auditor]
model_id = "claude-sonnet-5-5"
prompt_variant = "tv_v2"
temperature = 0.0
consensus_enabled = true
chunk_threshold = 70
chunk_size = 50
chunk_overlap = 5
chunk_max_parallel = 2
chunk_page_byte_budget_mb = 6
chunk_attachment_byte_budget_mb = 8
repair_context_max_chars = 8000
env_check_inline = false
env_check_engine = "off"
history_in_prompt = false
history_max_entries = 5

[batch]
concurrency = 16
extractor_concurrency = 4

[notify]
mode = "silent"
bot_admin_users = []

[folders]
auto_folder_enabled = false
auto_name_prefix = "Tv regression"
dashboard_sections = ["Tv regression"]

[policy]
enabled_rules = ["R0", "R1", "R2", "R4", "R5", "R6", "R7", "R8", "R10", "R11", "R12", "R14", "R15", "R16", "R17", "R18", "R19", "R20", "R21", "R22"]
defect_key_prefixes = ["QA-", "BUG-"]
environment_check_enabled = false

[policy.statuses]
pass = "Pass"
fail = "Fail"
blocked = "Blocked"
in_progress = "In Progress"
passed_with_issue = "Passed With Issue"
not_applicable = "Not Applicable"
not_executed = "Not Executed"
retest = "Retest"

[prune]
enabled = true
older_than_days = 60

[server]
host = "127.0.0.1"
port = 2411

[hub]
teams = ["web=Web", "desktop=Desktop", "tablet=Tablet", "mobile=Mobile", "reader=Reader", "tv=Tv", "portal=Portal"]

[costs]
refresh_seconds = 300
monthly_budget_usd = 100.0
warning_percent = 80.0
critical_percent = 100.0
