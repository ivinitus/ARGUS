# Example policy profile. Configure your Jira URL and numeric project ID locally.

[general]
product_name = "ARGUS"
team_name = "Tablet"
team_slug = "tablet"
state_dir = "~/.argus/tablet"

[extractor]
base_url = "https://jira.example.com"
project_id = "10000"
jira_pat_env = "ARGUS_JIRA_PAT"
jira_pat_path = "~/.argus/jira.pat"
execution_key_pattern = "^[A-Z][A-Z0-9_]*-E[0-9]+$"
out_dir = "output/tablet"

[auditor]
model_id = "claude-sonnet-5-5"
prompt_variant = "tablet_v2"
temperature = 0.0
consensus_enabled = true
chunk_threshold = 70
chunk_size = 50
chunk_overlap = 5
chunk_max_parallel = 2
env_check_inline = false
env_check_engine = "off"

[batch]
concurrency = 16
extractor_concurrency = 4

[notify]
mode = "verbose"
bot_admin_users = []

[folders]
auto_folder_enabled = false
auto_name_prefix = "Tablet regression"
auto_max_age_days = 8
dashboard_sections = ["Tablet regression"]

[policy]
enabled_rules = ["R0", "R1", "R2", "R4", "R5", "R6", "R7", "R8", "R10", "R11", "R12", "R13", "R14", "R15", "R16", "R17", "R18", "R19", "R20", "R21", "R22"]
defect_key_prefixes = ["QA-", "BUG-"]
environment_check_enabled = false
empty_step_status_optional = true
storefront_domain = "example"
storefront_domains = ["example"]
expected_environment_markers = ["preprod", "pre-prod", "staging"]
comment_required_environment_markers = []
production_navigation_notice_labels = ["privacy", "conditions of use"]

[policy.marketplace_tlds]
US = ".com"
UK = ".co.uk"
DE = ".de"
AU = ".com.au"
JP = ".co.jp"

[policy.statuses]
pass = "Pass"
fail = "Fail"
blocked = "Blocked"
in_progress = "In Progress"
passed_with_issue = "Passed With Issue"
not_applicable = "Not Applicable"
not_executed = "Not Executed"
retest = "Retest"

[policy.rule_severities]
R0 = "high"
R1 = "high"
R2 = "high"
R2b = "high"
R4 = "high"
R5 = "high"
R6 = "medium"
R7 = "high"
R8 = "high"
R9 = "high"
R9-doc = "medium"
R10 = "high"
R11 = "medium"
R12 = "high"
R13 = "high"
R14a = "high"
R14b = "high"
R15a = "high"
R15b = "high"
R15c = "high"
R16 = "high"
R17 = "high"
R18 = "high"
R19 = "high"
R20 = "high"
R21 = "high"
R22 = "low"

[prune]
enabled = true
older_than_days = 60

[server]
host = "127.0.0.1"
port = 2408

[hub]
teams = ["web=Web", "desktop=Desktop", "tablet=Tablet", "mobile=Mobile", "reader=Reader", "tv=Tv", "portal=Portal"]

[costs]
refresh_seconds = 300
monthly_budget_usd = 100.0
warning_percent = 80.0
critical_percent = 100.0
