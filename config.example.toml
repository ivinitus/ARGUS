# Copy to config.toml and set your Jira instance and project.
[general]
team_name = "My QA workspace"
state_dir = "~/.argus"

[extractor]
base_url = "https://jira.example.com"
project_id = "10000"
out_dir = "./output"
jira_pat_env = "ARGUS_JIRA_PAT"
jira_pat_path = "~/.argus/jira.pat"

[auditor]
model_api_url = "https://api.anthropic.com/v1/messages"
api_key_env = "ARGUS_MODEL_API_KEY"
model_id = "claude-sonnet-5-5"
auxiliary_model_id = "claude-haiku-5-5"
video_model_id = "claude-sonnet-5-5"
# Optional audio-capable chat API. Both URL and model must be configured.
# audio_api_url = "https://api.example.com/v1/chat/completions"
# video_audio_model_id = "your-audio-model"
# audio_api_key_env = "ARGUS_AUDIO_API_KEY"
# audio_api_format = "openai"

[policy]
storefront_domain = "example"
expected_environment_markers = ["staging", "preprod"]
defect_key_prefixes = ["QA-"]

[server]
host = "127.0.0.1"
port = 2405

[costs]
refresh_seconds = 300
monthly_budget_usd = 100.0
# Add current provider rates in USD per million tokens. Without configured
# rates ARGUS reports tokens/calls as unpriced, not as a zero-cost estimate.
# [costs.model_rates."your-model-id"]
# input_per_million = 1.0
# output_per_million = 5.0
# cache_write_per_million = 1.25
# cache_read_per_million = 0.1
